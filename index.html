<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#f3f0e9">
  <title>全媒体运营作品集</title>
  <link rel="icon" href="favicon.svg?v=20260920n" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=20260919e">
  <script src="assets/vendor/lucide.min.js" defer></script>
  <script src="script.js?v=20260920k" defer></script>
</head>
<body class="is-locked">
  <div class="password-gate" id="passwordGate" role="dialog" aria-modal="true" aria-labelledby="gateTitle">
    <div class="gate-panel">
      <p class="eyebrow">Integrated Media Portfolio</p>
      <h1 id="gateTitle">全媒体运营作品集</h1>
      <p class="gate-copy">请输入访问密码</p>
      <form class="gate-form" id="passwordForm" novalidate>
        <label class="sr-only" for="passwordInput">访问密码</label>
        <div class="gate-input-row">
          <input id="passwordInput" name="password" type="password" autocomplete="current-password" inputmode="text" placeholder="访问密码" autofocus>
          <button class="primary-button" type="submit" aria-label="进入作品集">
            <i data-lucide="arrow-right" aria-hidden="true"></i>
          </button>
        </div>
        <p class="gate-error" id="gateError" role="alert" aria-live="polite"></p>
      </form>
    </div>
  </div>

  <div class="site-shell" id="siteShell" aria-hidden="true" inert>
    <aside class="sidebar">
      <a class="brand" href="#top" aria-label="返回顶部">
        <span class="brand-mark">News</span>
        <span class="brand-text">全媒体运营<br>作品集</span>
      </a>

      <nav class="section-nav" id="sectionNav" aria-label="作品分类"></nav>

      <div class="sidebar-foot">
        <p>2026 / Selected Work</p>
        <button class="ghost-button" id="lockButton" type="button">
          <i data-lucide="lock-keyhole" aria-hidden="true"></i>
          <span>锁定作品集</span>
        </button>
      </div>
    </aside>

    <main class="main-content" id="top">
      <header class="page-header">
        <p class="eyebrow">Integrated Media / 2026</p>
        <h1>全媒体运营作品集</h1>
      </header>

      <div class="sections" id="sections"></div>
    </main>
  </div>

  <div class="viewer" id="viewer" aria-hidden="true">
    <div class="viewer-backdrop" data-close-viewer></div>
    <section class="viewer-panel" role="dialog" aria-modal="true" aria-labelledby="viewerTitle">
      <header class="viewer-header">
        <div>
          <p class="eyebrow" id="viewerType"></p>
          <h2 id="viewerTitle"></h2>
        </div>
        <button class="icon-button" id="viewerClose" type="button" aria-label="关闭预览">
          <i data-lucide="x" aria-hidden="true"></i>
        </button>
      </header>
      <div class="viewer-body" id="viewerBody"></div>
    </section>
  </div>

  <noscript>本站需要启用 JavaScript 才能浏览。</noscript>
</body>
</html>
